          python3 - <<'PY'
          import os, json, base64, urllib.request
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          path = 'weekly-model-trends.md'
          url = f'https://api.github.com/repos/{repo}/contents/{path}?ref=main'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'weekly-model-trends-automation',
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          text = base64.b64decode(data['content']).decode('utf-8')
          sha = data['sha']
          fixed = '# 每周模型趋势周报\n\n> 最新一期始终放在文件顶部。开放权重模型以开发团队官方 Hugging Face 账号与 Collection 中可下载权重为准；排名针对具体模型版本，不按厂商分配席位。\n\n---\n\n'
          if not text.startswith(fixed):
              raise SystemExit('Unexpected fixed header; refusing to modify history')
          report = open('/tmp/report.md', encoding='utf-8').read().rstrip()
          body = text[len(fixed):]
          marker = '# 每周模型趋势周报｜2026-09-04'
          if marker in body:
              start = body.index(marker)
              next_sep = body.find('\n---\n\n# 每周模型趋势周报｜', start)
              if next_sep == -1:
                  body = body[:start] + report + '\n'
              else:
                  body = body[:start] + report + body[next_sep:]
          else:
              body = report + '\n\n---\n\n' + body
          new_text = fixed + body
          payload = json.dumps({
              'message': 'Update weekly AI model trends report for 2026-09-04',
              'content': base64.b64encode(new_text.encode('utf-8')).decode('ascii'),
              'sha': sha,
              'branch': 'main',
          }).encode('utf-8')
          put_url = f'https://api.github.com/repos/{repo}/contents/{path}'
          req = urllib.request.Request(put_url, data=payload, method='PUT', headers={**headers, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as r:
              result = json.load(r)
          print(result['commit']['sha'])
          PY
